{% extends 'base.html' %}
{% block title %}Tawarkan Tumpangan - Nebeng-kUI{% endblock title %}

{% block content %}
<div class="form-page">
    <h1>Tawarkan Tumpangan</h1>
    <p class="forum-sub" style="margin-bottom:20px;">Isi rute dan jumlah kursi yang kosong.</p>
    <form id="form-tambah-post" method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="auth-field">
            {{ field.label_tag }}
            {{ field }}
            <!-- TEMPAT UNTUK MENAMPILKAN ERROR AJAX -->
            <p class="auth-error error-msg" id="error-{{ field.name }}" style="color:red; font-size:12px;"></p>
        </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn-auth" id="btn-submit">Posting</button>
            <a href="{% url 'forum:feed' %}" class="btn-cancel">Batal</a>
        </div>
    </form>
</div>

<!-- SCRIPT AJAX UNTUK POSTING -->
<script>
    document.getElementById('form-tambah-post').addEventListener('submit', async function (e) {
        e.preventDefault(); // Menahan reload halaman
        const form = this;
        const btnSubmit = document.getElementById('btn-submit');
        const formData = new FormData(form);

        btnSubmit.disabled = true;
        btnSubmit.textContent = "Menyimpan...";
        document.querySelectorAll('.error-msg').forEach(el => el.textContent = '');

        try {
            const targetUrl = form.getAttribute('action') || window.location.href;

            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}', // Header CSRF wajib Django
                    'X-Requested-With': 'XMLHttpRequest' // Penanda AJAX
                }
            });
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                window.location.href = "{% url 'forum:feed' %}"; // Redirect mulus jika sukses
            } else {
                // Tampilkan error di bawah masing-masing input
                if (data.errors) {
                    for (const [key, value] of Object.entries(data.errors)) {
                        const errorEl = document.getElementById(`error-${key}`);
                        if (errorEl) errorEl.textContent = value[0];
                    }
                }
            }
        } catch (error) {
            alert("Terjadi kesalahan jaringan.");
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = "Posting";
        }
    });
</script>
{% endblock content %}
