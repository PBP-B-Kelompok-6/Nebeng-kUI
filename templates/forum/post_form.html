{% extends 'base.html' %}
{% block title %}Buat Post - Nebeng-kUI{% endblock title %}

{% block content %}
<h2>Buat Post Tebengan</h2>
<form method="post" class="post-form">
    {% csrf_token %}
    {% for field in form %}
    <div class="auth-field">
        {{ field.label_tag }}
        {{ field }}
        {% for err in field.errors %}<p class="auth-error">{{ err }}</p>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn-auth">Posting</button>
</form>
{% endblock content %}
